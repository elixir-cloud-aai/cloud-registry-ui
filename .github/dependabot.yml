version: 2
# Every entry targets `dev` (`target-branch`), which takes all pull
# requests whatever the default branch is (`main` only moves forward to
# releases); commit messages start with `build(deps)` (Conventional
# Commits). Security updates always target the default branch
updates:
  # Dependencies in `package.json` and the lock (`bun.lock`), updated
  # together
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Playwright is pinned exactly, in line with the Playwright image of
      # the `e2e` job in `.github/workflows/ci.yml`: bump both by hand
      - dependency-name: "@playwright/test"
      # The types follow the oldest Node.js that the tests support (22, see
      # `docs/development.md`), not the newest
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Cloud Components (prereleases, pinned exactly), whose updates may
      # break the create form: in pull requests of their own
      elixir-cloud:
        patterns: ["@elixir-cloud/*"]
      node-dependencies:
        patterns: ["*"]
        exclude-patterns: ["@elixir-cloud/*"]
  # Packages that build the docs (`docs/requirements.txt`)
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    target-branch: dev
    commit-message:
      prefix: build
      include: scope
    groups:
      docs-dependencies:
        patterns: ["*"]
  # Actions in the workflows and in the local actions (`.github/actions/`),
  # including the pins of the shared actions of `elixir-cloud-aai/.github`
  # (to the commits of its releases, `@<commit> # vX.Y.Z`)
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    target-branch: dev
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
  # Images in the `Dockerfile` (Bun, pinned by digest); pull requests that
  # bump its version must also bump `packageManager` in `package.json`,
  # which CI's `lint` job checks
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        patterns: ["*"]
