# Scan the image of the latest release weekly for known vulnerabilities with
# Trivy (`.github/actions/scan-image`), as the `scan` job of `ci.yml` scans
# the images of pull requests and pushes, so that vulnerabilities found after
# a release are reported: the findings that have a fix are uploaded to code
# scanning, a full report (findings without a fix included) is uploaded as
# the workflow artifact `trivy-report-release-image` (JSON and table), and
# the workflow fails on critical and high vulnerabilities that have a fix
# (fixed by a new release). Accepted findings are listed in
# `.trivyignore.yaml`. The release scanned is the GitHub release marked as
# latest or, as long as there is none (until 1.0.0, all releases are
# pre-releases), the newest published one; its image is tagged with the
# version (`X.Y.Z`, without the `v` of the Git tag). Without a release, the
# run only says so. Scheduled runs use this workflow, the scan action and
# `.trivyignore.yaml` as on the default branch, and file their findings under it; once that is `main`, these are
# the copies released with the scanned image, so findings accepted on `dev`
# after a release apply from the next release on (dismiss their alerts in
# code scanning until then). The image is public, so no Docker Hub secrets
# are needed; its organization is the repository variable `DOCKERHUB_ORG`
# (by default `elixircloud`, as in `release.yml`; forks set it to the
# organization they publish to). Adapted from cloud-registry's scan workflow.

name: Scan

on:
    schedule:
        # Mondays, 05:37 UTC
        - cron: "37 5 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    scan:
        name: Scheduled scan
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            security-events: write # upload SARIF to code scanning
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # Published releases (drafts left out) with version tags only, so
            # that the image reference stays well-formed: the latest release
            # if there is one, otherwise the newest (by creation date)
            - name: Find the release to scan
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
                  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/cloud-registry-ui
              run: |
                  # as in the `prepare` job of `release.yml`
                  pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)[1-9][0-9]*)?$'
                  releases="$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts \
                      --limit 100 --json tagName,isLatest)"
                  tag="$(jq -r --arg pattern "${pattern}" \
                      '[.[] | select(.tagName | test($pattern))] | (map(select(.isLatest)) + .)[0].tagName // ""' \
                      <<< "${releases}")"
                  if [[ -z "${tag}" ]]; then
                      echo "::notice::No release yet, nothing to scan"
                      exit 0
                  fi
                  echo "Scanning ${IMAGE_NAME}:${tag#v}"
                  echo "image=${IMAGE_NAME}:${tag#v}" >> "$GITHUB_OUTPUT"
            - name: Scan image
              if: ${{ steps.release.outputs.image != '' }}
              uses: ./.github/actions/scan-image
              with:
                  image: ${{ steps.release.outputs.image }}
                  category: release-image
                  report: "true"
