# Everything that must pass on pull requests and pushes: the pull request
# title, lint and formatting (Biome), unit tests with coverage (reported to
# Codecov), type checks and the build, an audit of the production
# dependencies for known vulnerabilities, the Docker image and its scan for
# known vulnerabilities (Trivy), the end-to-end tests against a registry and
# a mock login provider (the login and services tests also against the
# image), and the docs. The gate `passed` ("CI passed") is the only
# required check and needs every other job to succeed. No `paths:` filters,
# so that the gate always reports; to skip a job with `if:`, allow that
# skip in the gate. Runs also when a pull request is edited, so that
# the title check follows the title; all jobs run then, as a run that
# skipped the tests would report "CI passed" for the commit. Bun comes in
# the version of `packageManager` in `package.json` (`bun-version-file`)

name: CI
on:
    push:
        branches: [dev, ai]
    pull_request:
        types: [opened, synchronize, reopened, edited]

permissions:
    contents: read

# Cancel superseded runs of a pull request; runs for pushes get their own
# group, so that queued runs for successive pushes are not dropped. Runs for
# edits that leave the title unchanged (e.g. of the description, also by
# bots) share a group of their own, so that they cancel each other but not
# the run for the pull request's commit
concurrency:
    group: >-
        ${{ github.workflow }}-${{
          github.event_name == 'push' && github.sha ||
          github.event.action == 'edited' && !github.event.changes.title &&
            format('{0}-edited', github.ref) ||
          github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    NEXT_TELEMETRY_DISABLED: "1"

jobs:
    # Pull request titles become the commit messages on `dev` (squash
    # merges): Conventional Commits, at most 50 characters (shared action of
    # elixir-cloud-aai/.github, pinned to the commit of a release). Skipped
    # on pushes and for Dependabot, whose titles can't be configured to
    # pass, unless someone else edits the title
    title:
        name: PR title
        if: >-
            github.event_name == 'pull_request' && (
              github.event.pull_request.user.login != 'dependabot[bot]' ||
              github.event.changes.title &&
              github.event.sender.login != 'dependabot[bot]')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        steps:
            - name: Check PR title
              uses: elixir-cloud-aai/.github/actions/pr-title@743e82d290a53768454999e413756a924e383259 # v1.0.0

    # Biome's lint, formatting and import order (`bun run lint`, see
    # `biome.json`), and the Bun images of the `Dockerfile`, which must be
    # of the version of `packageManager` in `package.json`, pinned by digest
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Check the Bun version of the Dockerfile
              run: |
                  version="$(jq -r '.packageManager // ""' package.json)"
                  if [[ "${version}" != bun@* ]]; then
                    echo "::error file=package.json::packageManager must be bun@<version>"
                    exit 1
                  fi
                  version="${version#bun@}"
                  # the image of each stage (the first word after `FROM` and
                  # its flags, such as `--platform`): every stage must use
                  # the Bun image, from Docker Hub
                  images="$(awk 'toupper($1) == "FROM" { for (i = 2; i <= NF; i++) if ($i !~ /^--/) { print $i; break } }' Dockerfile)"
                  if [[ -z "${images}" ]]; then
                    echo "::error file=Dockerfile::The Dockerfile has no stages"
                    exit 1
                  fi
                  while read -r image; do
                    if [[ ! "${image}" =~ ^(docker\.io/)?oven/bun:"${version}"@sha256:[0-9a-f]{64}$ ]]; then
                      echo "::error file=Dockerfile::${image} isn't oven/bun:${version} (packageManager in package.json), pinned by digest"
                      exit 1
                    fi
                  done <<< "${images}"
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Lint
              run: bun run lint

    # Vitest runs on Node.js, not on Bun's runtime
    test:
        name: Test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
            - name: Install dependencies
              run: bun install --frozen-lockfile
            # writes `coverage/lcov.info` (`vitest.config.mts`)
            - name: Run unit tests with coverage
              run: npm run test:coverage
            # Upload errors fail the workflow only on pushes to this
            # repository, because pull requests from forks and Dependabot,
            # and forks themselves, get no access to the Codecov token
            - name: Submit Report to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info
                  disable_search: true
                  fail_ci_if_error: ${{ github.event_name == 'push' && github.repository_owner == 'elixir-cloud-aai' }}
                  verbose: true

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Check types
              run: bunx tsc --noEmit
            # without settings: they are read when the app starts
            - name: Build the app
              run: bun run build

    # Fails on high and critical advisories in the production dependencies
    # of `bun.lock`, which Next.js bundles where image scanners can't see
    # them (see "Dependency audit" in `docs/development.md`). Needs no
    # installed packages
    audit:
        name: Audit
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - name: Audit production dependencies
              run: bun audit --prod --audit-level=high

    image:
        name: Build image
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # without settings: they are passed when the container starts
            - name: Build the Docker image
              run: docker build -t cloud-registry-ui:ci .
            # without login settings, the container stops with the reason
            - name: Check that the image needs the login settings
              run: |
                  status=0
                  output="$(timeout 60 docker run --rm cloud-registry-ui:ci 2>&1)" || status=$?
                  echo "${output}"
                  if [[ "${status}" != 1 ]] || ! grep -q "LOGIN_PROVIDERS" <<< "${output}"; then
                    echo "::error::The container didn't stop for missing login settings (status ${status})"
                    exit 1
                  fi
            # without the registry URL, too
            - name: Check that the image needs the registry URL
              env:
                  LOGIN_PROVIDERS: '[{"id":"ci","name":"CI","logo":"/elixir-on-cloud-mark.svg","issuer":"https://login.example.org","clientId":"ci","clientSecret":"ci"}]'
                  LOGIN_REDIRECT_URI: http://localhost:3000/auth/api/callback
              run: |
                  status=0
                  output="$(timeout 60 docker run --rm -e LOGIN_PROVIDERS -e LOGIN_REDIRECT_URI cloud-registry-ui:ci 2>&1)" || status=$?
                  echo "${output}"
                  if [[ "${status}" != 1 ]] || ! grep -q "NEXT_PUBLIC_CLOUD_REGISTRY_URL" <<< "${output}"; then
                    echo "::error::The container didn't stop for a missing registry URL (status ${status})"
                    exit 1
                  fi
            # with the settings, it serves the login page (the provider is
            # only contacted on login), with the registry passed at start
            - name: Check that the image serves the app
              env:
                  LOGIN_PROVIDERS: '[{"id":"ci","name":"CI","logo":"/elixir-on-cloud-mark.svg","issuer":"https://login.example.org","clientId":"ci","clientSecret":"ci"}]'
                  LOGIN_REDIRECT_URI: http://localhost:3000/auth/api/callback
                  NEXT_PUBLIC_CLOUD_REGISTRY_URL: https://registry.example.org/ga4gh/registry/v1
              run: |
                  docker run -d --name app -p 127.0.0.1:3000:3000 \
                    -e LOGIN_PROVIDERS -e LOGIN_REDIRECT_URI \
                    -e NEXT_PUBLIC_CLOUD_REGISTRY_URL cloud-registry-ui:ci
                  trap 'docker rm -f app >/dev/null' EXIT
                  for _ in $(seq 30); do
                    if curl -fs http://localhost:3000/auth/login | grep -q "login-redirect?provider=ci"; then
                      if ! curl -fs -D - -o /dev/null http://localhost:3000/auth/login | grep -qi "connect-src 'self' https://registry.example.org"; then
                        echo "::error::The page doesn't allow connections to the registry passed at start"
                        exit 1
                      fi
                      # the page passes it to the browser (the image has no
                      # values of its own to fall back to)
                      if ! curl -fs http://localhost:3000/auth/login | grep -qF 'window.__PUBLIC_SETTINGS__={\"NEXT_PUBLIC_CLOUD_REGISTRY_URL\":\"https://registry.example.org/ga4gh/registry/v1\"}'; then
                        echo "::error::The page doesn't pass the registry passed at start to the browser"
                        exit 1
                      fi
                      exit 0
                    fi
                    sleep 2
                  done
                  docker logs app
                  echo "::error::The container didn't serve the login page"
                  exit 1
            # handed to `scan`, so that exactly the checked image is scanned
            - name: Save the image
              run: docker save cloud-registry-ui:ci -o "${RUNNER_TEMP}/image.tar"
            - name: Upload the image
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: image
                  path: ${{ runner.temp }}/image.tar
                  retention-days: 7
                  if-no-files-found: error

    # Scans the image of `image` with Trivy (shared action
    # `elixir-cloud-aai/.github/actions/scan-image`), with the flags of the release scan (`release.yml`), in a job of its own
    # without credentials, so that a vulnerability with a fix shows up before
    # a release, not in it. The findings that have a fix are uploaded to code
    # scanning (not for pull requests from forks, whose token can't write
    # them), and the job fails on critical and high vulnerabilities that have
    # a fix. Accepted findings are listed, with a reason and an expiry date,
    # in `.trivyignore.yaml`. The image of the latest release is scanned
    # weekly (`scan.yml`)
    scan:
        name: Scan image
        needs: image
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            security-events: write # upload SARIF to code scanning
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Download the image
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: image
                  path: ${{ runner.temp }}
            - name: Load the image
              run: docker load -i "${RUNNER_TEMP}/image.tar"
            - name: Scan image
              uses: elixir-cloud-aai/.github/actions/scan-image@743e82d290a53768454999e413756a924e383259 # v1.0.0
              with:
                  image: cloud-registry-ui:ci
                  category: image
                  upload: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    # The stack of `e2e/stack/compose.yaml`; Playwright builds and starts the
    # app (`playwright.config.ts`). The tests run in Playwright's image, which
    # has the browsers and their system packages (installing them from the
    # runner's package mirror can take half an hour), with Bun of the runner
    # for the web server; keep its version in line with `@playwright/test`
    e2e:
        name: End-to-end tests
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Start the registry and the login provider
              run: docker compose -f e2e/stack/compose.yaml up -d --wait
            - name: Run end-to-end tests
              run: >-
                  docker run --rm --network host
                  --add-host oidc.localhost:127.0.0.1
                  --user "$(id -u):$(id -g)" --env HOME=/tmp --env CI
                  --env PATH=/opt/bun:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                  --volume "$(readlink -f "$(command -v bun)"):/opt/bun/bun:ro"
                  --volume "${PWD}:/app" --workdir /app
                  mcr.microsoft.com/playwright:v1.56.1-noble
                  npx playwright test
            - name: Show logs of the stack
              if: failure()
              run: docker compose -f e2e/stack/compose.yaml logs
            - name: Upload the test report
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    # The login and services tests of `e2e` against the image of `image`,
    # which runs the standalone server on Bun, not `next start` on Node.js
    # as `e2e` does: service `app` of the stack (profile `image`), which
    # Playwright reaches through `E2E_BASE_URL` instead of starting the app.
    # A job of its own, as `e2e` takes up most of its time limit
    e2e-image:
        name: End-to-end tests (image)
        needs: image
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # Playwright of `bun.lock`, which runs in Playwright's image, as
            # in `e2e`; the app isn't built
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Download the image
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: image
                  path: ${{ runner.temp }}
            - name: Load the image
              run: docker load -i "${RUNNER_TEMP}/image.tar"
            - name: Start the stack with the image
              run: docker compose -f e2e/stack/compose.yaml --profile image up -d --wait
            - name: Run end-to-end tests
              run: >-
                  docker run --rm --network host
                  --add-host oidc.localhost:127.0.0.1
                  --user "$(id -u):$(id -g)" --env HOME=/tmp --env CI
                  --env E2E_BASE_URL=http://localhost:3100
                  --volume "${PWD}:/app" --workdir /app
                  mcr.microsoft.com/playwright:v1.56.1-noble
                  npx playwright test e2e/auth.spec.ts e2e/services.spec.ts
            - name: Show logs of the stack
              if: failure()
              run: docker compose -f e2e/stack/compose.yaml --profile image logs
            - name: Upload the test report
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report-image
                  path: playwright-report/
                  retention-days: 7

    # as Read the Docs builds them (`.readthedocs.yaml`), failing on warnings,
    # e.g. of broken links and anchors
    docs:
        name: Docs
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # Python version of Read the Docs (`.readthedocs.yaml`)
            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.13"
                  cache: pip
                  cache-dependency-path: docs/requirements.txt
            - name: Install dependencies
              run: pip install -r docs/requirements.txt
            - name: Build documentation
              run: mkdocs build --strict

    # The shared gate action of elixir-cloud-aai/.github fails on failed,
    # cancelled and skipped jobs (only `title` may be skipped here, on pushes
    # and for Dependabot: list further skips in `allow-skipped`) and on
    # missing results
    passed:
        name: CI passed
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: always()
        needs: [title, lint, test, build, audit, image, scan, e2e, e2e-image, docs]
        permissions: {}
        steps:
            - name: Check results of all jobs
              uses: elixir-cloud-aai/.github/actions/gate@743e82d290a53768454999e413756a924e383259 # v1.0.0
              with:
                  needs: ${{ toJSON(needs) }}
                  allow-skipped: title
