# Release when a version tag (`vX.Y.Z`, or `vX.Y.Z-alphaN`, `vX.Y.Z-betaN`,
# `vX.Y.Z-rcN` for pre-releases) is pushed: check the tag, the versions in
# `package.json` and `CITATION.cff`, and that CI passed for its commit
# (`prepare`); build and push the Docker image (with SBOM and provenance
# attestations) by digest, untagged (`push`); scan exactly that digest for
# vulnerabilities in a job of its own, without the release credentials and
# signing identity (`scan`); and only then attest its build provenance, sign
# it (Sigstore keyless signing), tag it, and create the GitHub release with
# GitHub's generated notes (`publish`; see "Verifying images" in the
# README). `push` and `publish` each need approval in the `release`
# environment (required reviewer, Docker Hub secrets `DOCKERHUB_LOGIN` and
# `DOCKERHUB_TOKEN`). Re-running all jobs builds, scans, signs and tags a new
# digest, but never moves a version tag that exists to another digest (the
# run fails instead); re-running failed jobs reuses the digest already
# pushed. The image has no settings: they are passed when it starts, so one
# image serves any deployment. UI versions follow the registry in major and
# minor version (see "Compatibility" in the README). Until 1.0.0, all
# releases are GitHub pre-releases (but stable ones still update the
# `latest` image). See "Releasing" in `CONTRIBUTING.md` for the steps and
# the repository settings it needs. Adapted from cloud-registry's release
# workflow.

name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

# Fully qualified (`docker.io/`), as the attestation needs it. The Docker Hub
# organization is the repository variable `DOCKERHUB_ORG` (by default
# `elixircloud`), so that forks can publish to their own
env:
    IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/cloud-registry-ui

# One run per tag, so that a run waiting for approval is not cancelled by
# the run of another tag; `latest` is decided at the end of each run, from
# freshly fetched tags on `main`
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    prepare:
        name: Prepare release
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            actions: read # read the CI runs of the release commit
        outputs:
            version: ${{ steps.version.outputs.version }}
            prerelease: ${{ steps.version.outputs.prerelease }}
            sha: ${{ steps.version.outputs.sha }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # Full history and all tags, to check that the release commit
                  # is on `main`
                  fetch-depth: 0
            # Guards against accidental releases, e.g., of unmerged commits;
            # the `release` environment's protection rules (required reviewer)
            # are what actually control publishing
            - name: Check release tag and commit
              id: version
              env:
                  TAG: ${{ github.ref_name }}
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)[1-9][0-9]*)?$'
                  if [[ ! "${TAG}" =~ ${pattern} ]]; then
                      echo "::error::Tag '${TAG}' is not a release version (vX.Y.Z, or vX.Y.Z-alphaN, -betaN, -rcN)"
                      exit 1
                  fi
                  version="${TAG#v}"
                  # Pre-releases, and all releases until 1.0.0
                  prerelease=false
                  if [[ -n "${BASH_REMATCH[4]}" || "${BASH_REMATCH[1]}" == 0 ]]; then
                      prerelease=true
                  fi
                  # Annotated, with a signature that GitHub verified
                  if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]]; then
                      echo "::error::Tag '${TAG}' is not annotated (git tag -s)"
                      exit 1
                  fi
                  verified="$(gh api "repos/${REPOSITORY}/git/tags/$(git rev-parse "refs/tags/${TAG}")" \
                      --jq .verification.verified)"
                  if [[ "${verified}" != "true" ]]; then
                      echo "::error::Tag '${TAG}' has no signature verified by GitHub (git tag -s)"
                      exit 1
                  fi
                  if ! git merge-base --is-ancestor HEAD origin/main; then
                      echo "::error::Release commit is not on 'main'"
                      exit 1
                  fi
                  {
                      echo "version=${version}"
                      echo "prerelease=${prerelease}"
                      echo "sha=$(git rev-parse HEAD)"
                  } >> "${GITHUB_OUTPUT}"
            # The version of the release is set in the release commit, so that
            # the sources, the citation metadata and the tag agree
            - name: Check versions in package.json and CITATION.cff
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  package="$(jq -r .version package.json)"
                  citation="$(yq -r .version CITATION.cff)"
                  if [[ "${package}" != "${VERSION}" || "${citation}" != "${VERSION}" ]]; then
                      echo "::error::Versions don't match the tag: package.json '${package}', CITATION.cff '${citation}', tag '${VERSION}'"
                      exit 1
                  fi
            # The checks above don't run the tests: require a successful run of
            # the CI workflow for a push of the release commit; runs for pull
            # requests test merge commits, not the commit itself. Re-runs that
            # succeeded count
            - name: Check that CI passed for the release commit
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  SHA: ${{ steps.version.outputs.sha }}
              run: |
                  runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&status=success&per_page=1" \
                      --jq .total_count)"
                  if [[ ! "${runs}" =~ ^[0-9]+$ || "${runs}" -lt 1 ]]; then
                      echo "::error::No successful run of the CI workflow (ci.yml) for a push of ${SHA}; once CI passed for it, re-run this workflow"
                      exit 1
                  fi

    # Builds the image of the release commit once and pushes it by digest only
    # (untagged, with SBOM and provenance attestations), for `scan` to scan and
    # `publish` to sign and tag. Digests of runs that fail (or fail the scan)
    # are never signed or tagged, but stay on Docker Hub, untagged (pullable
    # by digest only)
    push:
        name: Push release image
        needs: prepare
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # Docker Hub secrets (required reviewer)
        environment: release
        permissions:
            contents: read
        outputs:
            digest: ${{ steps.push.outputs.digest }}
        steps:
            # The commit checked by `prepare`
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare.outputs.sha }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            # OCI labels with the version, commit and source; `tags` only sets
            # the version label (the image is tagged by digest in `publish`,
            # after the scan)
            - name: Generate image labels
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE_NAME }}
                  flavor: latest=false
                  tags: type=raw,value=${{ needs.prepare.outputs.version }}
            - name: Log in to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DOCKERHUB_LOGIN }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            # Without build arguments: the image has no settings
            - name: Build and push image by digest
              id: push
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
                  sbom: true
                  provenance: mode=max
                  labels: ${{ steps.meta.outputs.labels }}

    # Scans exactly the pushed digest (`<image>@<digest>`; public, so pulling
    # it needs no login) with Trivy (`.github/actions/scan-image`; fails on
    # fixable critical and high vulnerabilities). Kept apart from `push` and
    # `publish`, so that Trivy never runs next to the Docker Hub credentials,
    # the `contents: write` token and the signing identity
    scan:
        name: Scan release image
        needs: [prepare, push]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare.outputs.sha }}
            - name: Check image digest
              env:
                  DIGEST: ${{ needs.push.outputs.digest }}
              run: |
                  if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                      echo "::error::Invalid image digest '${DIGEST}'"
                      exit 1
                  fi
            - name: Scan image
              uses: ./.github/actions/scan-image
              with:
                  image: ${{ env.IMAGE_NAME }}@${{ needs.push.outputs.digest }}
                  category: release
                  upload: "false"

    publish:
        name: Publish release
        needs: [prepare, push, scan]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment:
            name: release
            url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        permissions:
            contents: write # create the GitHub release
            id-token: write # Sigstore signing certificates
            attestations: write # GitHub artifact attestations
        env:
            VERSION: ${{ needs.prepare.outputs.version }}
            DIGEST: ${{ needs.push.outputs.digest }}
        steps:
            # The commit checked by `prepare`, with all tags, to find the
            # previous release
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare.outputs.sha }}
                  fetch-depth: 0
            - name: Check image digest
              run: |
                  if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                      echo "::error::Invalid image digest '${DIGEST}'"
                      exit 1
                  fi
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Log in to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DOCKERHUB_LOGIN }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            # Of the scanned digest
            - name: Attest build provenance
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-name: ${{ env.IMAGE_NAME }}
                  subject-digest: ${{ env.DIGEST }}
                  push-to-registry: true
                  # No artifact metadata storage record (needs another
                  # permission)
                  create-storage-record: false
            - name: Install cosign
              uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
            # The signature covers the digest, and so every tag of it
            - name: Sign image
              run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
            # Decided last, from freshly fetched tags (the repository is
            # public, so no credentials are needed), so that neither a re-run
            # of an older release nor a concurrent release moves `latest`
            # back: the highest stable release among the tags on `main`, so
            # that stray tags are ignored
            - name: Check whether this is the highest release
              id: latest
              env:
                  TAG: ${{ github.ref_name }}
                  PRERELEASE_SUFFIX: ${{ contains(github.ref_name, '-') }}
                  REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
              run: |
                  latest=false
                  if [[ "${PRERELEASE_SUFFIX}" != "true" ]]; then
                      git init --quiet repo
                      cd repo
                      git fetch --quiet --filter=blob:none --tags "${REPOSITORY_URL}" \
                          "+refs/heads/main:refs/remotes/origin/main"
                      highest="$(git tag -l 'v*' --merged origin/main \
                          | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
                          | sort -V | tail -n 1 || true)"
                      if [[ "${highest}" == "${TAG}" ]]; then
                          latest=true
                      fi
                  fi
                  echo "latest=${latest}" >> "${GITHUB_OUTPUT}"
            # Tags `X.Y.Z` (and `latest`) point to the checked, scanned and
            # signed digest: a single source is copied as is
            - name: Tag image
              env:
                  LATEST: ${{ steps.latest.outputs.latest }}
              run: |
                  # Released images don't change: a version tag of another
                  # digest (e.g. after re-running all jobs) stops the run
                  current="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" \
                      --format '{{ json .Manifest }}' 2>/dev/null | jq -r .digest || true)"
                  if [[ -n "${current}" && "${current}" != "${DIGEST}" ]]; then
                      echo "::error::${IMAGE_NAME}:${VERSION} already points to ${current}; release a new version instead"
                      exit 1
                  fi
                  tags=("${IMAGE_NAME}:${VERSION}")
                  if [[ "${LATEST}" == "true" ]]; then
                      tags+=("${IMAGE_NAME}:latest")
                  fi
                  for tag in "${tags[@]}"; do
                      docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
                      actual="$(docker buildx imagetools inspect "${tag}" \
                          --format '{{ json .Manifest }}' | jq -r .digest)"
                      if [[ "${actual}" != "${DIGEST}" ]]; then
                          echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
                          exit 1
                      fi
                  done
            # A draft first, published last, so that immutable releases (a
            # repository setting) can still get their notes; re-runs finish
            # the draft of an earlier attempt and leave a published release as
            # it is. GitHub's generated notes list the merged pull requests
            # since the previous published release in the history of the
            # release commit (tags without a release, e.g. of a failed run,
            # don't count; without one, all of them); the maintainers add the
            # curated sections afterwards (the notes of published releases
            # stay editable). GitHub never marks pre-releases as the latest
            # release
            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ github.ref_name }}
                  LATEST: ${{ steps.latest.outputs.latest }}
                  PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
              run: |
                  if [[ "${PRERELEASE}" == "true" ]]; then
                      LATEST=false
                  fi
                  state="$(gh release view "${TAG}" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)"
                  if [[ "${state}" == "published" ]]; then
                      echo "Release ${TAG} is already published: left as it is"
                      exit 0
                  fi
                  if [[ "${state}" == "none" ]]; then
                      published="$(gh release list --limit 1000 --exclude-drafts \
                          --json tagName --jq '.[].tagName')"
                      previous=""
                      while read -r tag; do
                          if [[ "${tag}" != "${TAG}" ]] && grep -qxF -- "${tag}" <<< "${published}"; then
                              previous="${tag}"
                              break
                          fi
                      done < <(git tag -l 'v*' --merged HEAD --sort=-creatordate)
                      args=(-f "tag_name=${TAG}")
                      if [[ -n "${previous}" ]]; then
                          args+=(-f "previous_tag_name=${previous}")
                      fi
                      notes="$(mktemp)"
                      gh api "repos/${GH_REPO}/releases/generate-notes" "${args[@]}" \
                          --jq .body > "${notes}"
                      gh release create "${TAG}" \
                          --draft \
                          --verify-tag \
                          --title "${TAG}" \
                          --notes-file "${notes}" \
                          --prerelease="${PRERELEASE}"
                  fi
                  gh release edit "${TAG}" --title "${TAG}" \
                      --prerelease="${PRERELEASE}" --latest="${LATEST}" --draft=false
