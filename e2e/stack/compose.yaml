# Services for the end-to-end tests: cloud-registry with MongoDB, a mock
# OpenID Connect provider and a service with service info to import. The app
# runs outside, started by Playwright (`playwright.config.ts`), or, with the
# profile `image`, from its image (service `app`). Ports differ from the
# defaults so that the stack can run next to a local development setup.
#
# - Registry:     http://localhost:8180/ga4gh/registry/v1
# - Login:        http://oidc.localhost:8190/oidc
# - Service info: http://service-info:8191/<key>/service-info for the
#   registry, http://localhost:8191/<key>/service-info for the tests
# - App (profile `image`): http://localhost:3100
name: cloud-registry-ui-e2e

services:
    # reachable as `oidc.localhost:8190` from the browser and the app on the
    # host (`*.localhost` is the loopback interface) and, through the network
    # alias, from the registry, so that tokens get the same issuer. Its
    # discovery lists no `token_endpoint_auth_methods_supported`, so the app
    # authenticates with HTTP Basic (`client_secret_basic`), and an
    # `end_session_endpoint`, to which the app's logout leads
    oidc:
        image: ghcr.io/navikt/mock-oauth2-server:6.0.7
        environment:
            SERVER_PORT: "8190"
            JSON_CONFIG_PATH: /config/oidc.json
        ports:
            - "127.0.0.1:8190:8190"
        volumes:
            - ./oidc.json:/config/oidc.json:ro
        # ready once it serves the discovery document
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "-q",
                    "-O",
                    "/dev/null",
                    "http://localhost:8190/oidc/.well-known/openid-configuration",
                ]
            interval: 2s
            timeout: 5s
            retries: 60
        networks:
            default:
                aliases:
                    - oidc.localhost

    # a service as the registry fetches it (`service-info.py`)
    service-info:
        image: python:3.13-alpine
        command: ["python", "/service-info.py"]
        ports:
            - "127.0.0.1:8191:8191"
        volumes:
            - ./service-info.py:/service-info.py:ro
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://localhost:8191/health/service-info', timeout=4)",
                ]
            interval: 2s
            timeout: 5s
            retries: 30

    registry:
        # cloud-registry from `dev` at 1d988ad, as the paths of users' roles,
        # labels, the listing of expired invitations, the listing of the
        # registry itself, the camelCase names of its API, the removal of the
        # invitations of users whose roles are revoked, and the import and sync
        # of service info aren't released yet (cloud-registry#337, #334, #335,
        # #349, #353, #355, #358-#361); back to the release once there is
        # one that has them (the app also uses GET /approvals and conflict
        # codes of 0.5.0, renames and admin mode of 0.6.0, invitations and the
        # services limit of 1.0.0rc1);
        # pinned by digest for repeatable runs
        image: ${E2E_REGISTRY_IMAGE:-docker.io/elixircloud/cloud-registry:sha-1d988adaa9734173b55ee931e6c4d0ed8ea6bccb@sha256:7bf7f0fff5e92643bcf4a8c566f7fddef291906ed52e368230759f0778818d57}
        depends_on:
            mongodb:
                condition: service_healthy
            oidc:
                condition: service_healthy
            service-info:
                condition: service_healthy
        ports:
            - "127.0.0.1:8180:8080"
        environment:
            FOCA_CONFIG_OVERLAY: /etc/cloud-registry/config.e2e.yaml
        volumes:
            - ./registry.yaml:/etc/cloud-registry/config.e2e.yaml:ro
        # ready once it answers; `docker compose up --wait` waits for it
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://localhost:8080/ga4gh/registry/v1/service-info', timeout=4)",
                ]
            interval: 2s
            timeout: 5s
            retries: 60

    mongodb:
        image: mongo:7.0
        tmpfs:
            - /data/db
        healthcheck:
            test:
                [
                    "CMD",
                    "mongosh",
                    "--quiet",
                    "--eval",
                    "db.adminCommand('ping').ok",
                ]
            interval: 2s
            timeout: 5s
            retries: 30

    # the app from its image (`E2E_APP_IMAGE`, by default the one that CI
    # builds), as it ships: the standalone server on Bun. On the host's
    # network, as Playwright's app would be: the browsers reach it at the
    # same address, and it reaches the login provider at the browsers'
    # `oidc.localhost:8190`. The settings of the tests
    # (`playwright.config.ts`): keep them in step
    app:
        profiles: [image]
        image: ${E2E_APP_IMAGE:-cloud-registry-ui:ci}
        network_mode: host
        extra_hosts:
            - "oidc.localhost:127.0.0.1"
        environment:
            PORT: "3100"
            LISTEN_HOSTNAME: 127.0.0.1
            NEXT_PUBLIC_CLOUD_REGISTRY_URL: http://localhost:8180/ga4gh/registry/v1
            LOGIN_PROVIDERS: >-
                [{"id": "mock", "name": "Mock Login",
                "logo": "/elixir-on-cloud-mark.svg",
                "issuer": "http://oidc.localhost:8190/oidc",
                "clientId": "cloud-registry-ui-e2e",
                "clientSecret": "e2e-secret"}]
            LOGIN_REDIRECT_URI: http://localhost:3100/auth/api/callback
        depends_on:
            oidc:
                condition: service_healthy
            registry:
                condition: service_healthy
        # the image's check, more often, so that `--wait` returns early
        healthcheck:
            test:
                [
                    "CMD",
                    "bun",
                    "-e",
                    "fetch('http://127.0.0.1:3100/', { redirect: 'manual' }).then((res) => process.exit(res.status < 400 ? 0 : 1), () => process.exit(1))",
                ]
            interval: 2s
            timeout: 5s
            retries: 30
