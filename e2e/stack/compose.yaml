# Services for the end-to-end tests: cloud-registry with MongoDB and a mock
# OpenID Connect provider. The app runs outside, started by Playwright
# (`playwright.config.ts`). Ports differ from the defaults so that the stack
# can run next to a local development setup.
#
# - Registry: http://localhost:8180/ga4gh/registry/v1
# - Login:    http://oidc.localhost:8190/oidc
name: cloud-registry-ui-e2e

services:
    # reachable as `oidc.localhost:8190` from the browser and the app on the
    # host (`*.localhost` is the loopback interface) and, through the network
    # alias, from the registry, so that tokens get the same issuer
    oidc:
        image: ghcr.io/navikt/mock-oauth2-server:6.0.7
        environment:
            SERVER_PORT: "8190"
            JSON_CONFIG_PATH: /config/oidc.json
        ports:
            - "127.0.0.1:8190:8190"
        volumes:
            - ./oidc.json:/config/oidc.json:ro
        # ready once it serves the discovery document
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "-q",
                    "-O",
                    "/dev/null",
                    "http://localhost:8190/oidc/.well-known/openid-configuration",
                ]
            interval: 2s
            timeout: 5s
            retries: 60
        networks:
            default:
                aliases:
                    - oidc.localhost

    registry:
        # cloud-registry from `dev` at d3e4fd7, as the paths of users' roles,
        # labels, the listing of expired invitations, the listing of the
        # registry itself, the camelCase names of its API and the removal of
        # the invitations of users whose roles are revoked aren't released yet
        # (cloud-registry#337, #334, #335, #349, #353, #355); back to the
        # release once there is
        # one that has them (the app also uses GET /approvals and conflict
        # codes of 0.5.0, renames and admin mode of 0.6.0, invitations and the
        # services limit of 1.0.0rc1);
        # pinned by digest for repeatable runs
        image: ${E2E_REGISTRY_IMAGE:-docker.io/elixircloud/cloud-registry:sha-d3e4fd7dc27fefc08c39f4d56d90ae3d86b21ac6@sha256:a261efa8324fa03c1caf2e8faa58a962d25f4bf02753a6a3c0a6f8d1ab0916ad}
        depends_on:
            mongodb:
                condition: service_healthy
            oidc:
                condition: service_healthy
        ports:
            - "127.0.0.1:8180:8080"
        environment:
            FOCA_CONFIG_OVERLAY: /etc/cloud-registry/config.e2e.yaml
        volumes:
            - ./registry.yaml:/etc/cloud-registry/config.e2e.yaml:ro
        # ready once it answers; `docker compose up --wait` waits for it
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://localhost:8080/ga4gh/registry/v1/service-info', timeout=4)",
                ]
            interval: 2s
            timeout: 5s
            retries: 60

    mongodb:
        image: mongo:7.0
        tmpfs:
            - /data/db
        healthcheck:
            test:
                [
                    "CMD",
                    "mongosh",
                    "--quiet",
                    "--eval",
                    "db.adminCommand('ping').ok",
                ]
            interval: 2s
            timeout: 5s
            retries: 30
