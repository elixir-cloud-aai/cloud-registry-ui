site_name: Cloud Registry UI
site_description: >-
  Web app for browsing and managing services in a Cloud Registry, by ELIXIR
  On-Cloud
# Read the Docs serves each version under its own path (e.g., `/en/latest/`)
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://cloud-registry-ui.readthedocs.io/en/latest/"]
repo_url: https://github.com/elixir-cloud-aai/cloud-registry-ui
repo_name: elixir-cloud-aai/cloud-registry-ui
copyright: Copyright &copy; ELIXIR On-Cloud

# Packages of the build (not part of the site)
exclude_docs: |
  requirements.txt

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - User guide:
      - user-guide/index.md
      - Browsing and searching: user-guide/browsing.md
      - Registering and editing services: user-guide/registering.md
      - Access and permissions: user-guide/access.md
      - Verifications: user-guide/verifications.md
      - Pending entries: user-guide/pending.md
      - Admin mode: user-guide/admin-mode.md
  - Operator guide:
      - operator-guide/index.md
      - Deployment: operator-guide/deployment.md
      - Configuration: operator-guide/configuration.md
      - Login: operator-guide/login.md
      - Branding: operator-guide/branding.md
      - Admins and admin mode: operator-guide/admins.md
      - Upgrading: operator-guide/upgrading.md
  - Development: development.md
